startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      rapidApiKey:
        type: string
        description: Optional for keyless local statutory/taxonomy/catalog tools; set RapidAPI key to execute remote 73-engine CPU solvers and SEC 10-K audits.
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['src/index.mjs'],
      env: config && config.rapidApiKey ? { RAPIDAPI_KEY: config.rapidApiKey } : {}
    })
